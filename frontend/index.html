<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/icono.svg" />
    <title>Rastreador de hábitos</title>
    <script>
      // Aplica el tema antes de pintar, para que no parpadee al cargar.
      (function () {
        var guardado = null;
        try { guardado = localStorage.getItem('rh.tema'); } catch (e) {}
        var oscuro = guardado === 'oscuro' ||
          ((guardado === null || guardado === 'sistema') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', oscuro);
      })();
    </script>
  </head>
  <body class="bg-fondo text-texto antialiased">
    <div id="raiz"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
